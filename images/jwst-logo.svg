<?xml version="1.0" encoding="UTF-8"?>
<!-- Stylized, original JWST-inspired mark (non-identical/original design) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="titleJWST">
  <title id="titleJWST">JWST (stylized) logo</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF8C5F"/>
    </linearGradient>
  </defs>

  <!-- central hex-like cluster (abstract mirror) -->
  <g transform="translate(50,38)">
    <circle cx="0" cy="0" r="10" fill="url(#g)"/>
    <circle cx="-18" cy="0" r="8" fill="#FF8C5F" opacity="0.95"/>
    <circle cx="18" cy="0" r="8" fill="#FF8C5F" opacity="0.95"/>
    <circle cx="-9" cy="15" r="7" fill="#FF6B35" opacity="0.95"/>
    <circle cx="9" cy="15" r="7" fill="#FF6B35" opacity="0.95"/>
    <circle cx="-9" cy="-15" r="7" fill="#FF8C5F" opacity="0.9"/>
    <circle cx="9" cy="-15" r="7" fill="#FF8C5F" opacity="0.9"/>
  </g>

  <!-- stylized boom + instrument silhouette -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M30 72 L50 50 L70 72" />
    <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>
  </g>

  <!-- acronym text (kept simple, neutral) -->
  <text x="50" y="92" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">JWST</text>
</svg>
